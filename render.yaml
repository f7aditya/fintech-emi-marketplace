# One-click deploy of the backend API + PostgreSQL on Render (https://render.com).
# The mobile app (mobile/) is built separately with EAS / Expo.
services:
  - type: web
    name: onefi-marketplace-api-aditya
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && node prisma/seed.js
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: onefi-marketplace-db
          property: connectionString
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        # Native app requests send no Origin header, so "*" is fine here. Lock this
        # down to the Expo web origin if you also deploy the web build.
        value: "*"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        # A strong random secret for signing session tokens.
        generateValue: true
      - key: ALLOW_MOCK_AUTH
        # Dev-only mock sign-in is force-disabled in production anyway; keep it explicit.
        value: "false"
      - key: GOOGLE_CLIENT_IDS
        # Comma-separated Google OAuth client IDs (Web + Android + iOS). Set in the
        # Render dashboard once you have them; leave blank to disable Google verify.
        sync: false

databases:
  - name: onefi-marketplace-db
    plan: free
    databaseName: onefi_marketplace
    user: onefi
